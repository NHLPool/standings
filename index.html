<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Fantasy NHL League</title>
<style>
:root{--bg:#07111f;--card:#102036;--line:#29405b;--text:#f5f9ff;--muted:#9db0c5;--blue:#2b9cff;--ok:#70dfa4;--warn:#ffc27a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#17385f,transparent 34%),#07111f;color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:26px 0 50px}header,.season-nav,.card{background:rgba(13,29,49,.94);border:1px solid #ffffff18;box-shadow:0 18px 60px #0006}header{border-radius:24px;padding:20px 24px;display:flex;align-items:center;gap:22px}.logo-wrap{display:grid;place-items:center;flex:0 0 156px;width:156px;height:156px;padding:10px;border-radius:22px;background:linear-gradient(145deg,#f8fbff,#cbd5df);box-shadow:inset 0 0 0 1px #fff9,0 10px 28px #0005}.nhl-logo{display:block;width:100%;height:100%;object-fit:contain}.fallback{display:none;width:102px;height:116px;place-items:center;background:#050505;border:5px solid #ddd;clip-path:polygon(10% 0,90% 0,100% 18%,86% 86%,50% 100%,14% 86%,0 18%);font-size:30px;font-weight:900;font-style:italic}h1{margin:0;font-size:clamp(1.7rem,4vw,2.65rem)}p{margin:7px 0;color:var(--muted)}.season-nav{display:flex;gap:10px;margin:20px 0;padding:12px;border-radius:18px;overflow-x:auto}.season-btn{flex:1 0 auto;min-width:120px;color:#dceafb;background:#172b44;border:1px solid var(--line);border-radius:12px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:800}.season-btn.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#1878ed,#32b2ff);box-shadow:0 8px 24px #238ff647}.season-btn.current-season{position:relative;border-color:#45b7ff;box-shadow:inset 0 0 0 1px #45b7ff55}.season-btn.current-season::after{content:"CURRENT";display:inline-block;margin-left:8px;padding:3px 6px;border-radius:999px;background:#68dcff;color:#06233a;font-size:.58rem;font-weight:950;letter-spacing:.08em;vertical-align:1px}.season-btn.current-season.active{background:linear-gradient(135deg,#006fe8,#35c4ff);box-shadow:0 0 0 2px #7ee4ff55,0 12px 30px #168fe866}.current-chip{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 11px;border:1px solid #2e8ec2;border-radius:999px;background:#0d3d59;color:#9beaff;font-size:.76rem;font-weight:850}.current-dot{width:8px;height:8px;border-radius:50%;background:#58e3a4;box-shadow:0 0 0 4px #58e3a422}.card{border-radius:22px;overflow:hidden}.head{padding:18px 21px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line)}h2{font-size:1rem;letter-spacing:.1em;text-transform:uppercase;margin:0}.sub{font-size:.8rem;color:var(--muted);margin-top:5px}.badge{font-size:.76rem;color:#bcecff;background:#103e57;padding:6px 9px;border-radius:99px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:13px 15px;background:#07142199}td{padding:15px;border-top:1px solid #ffffff13}.rank span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#203650;font-weight:900}.top1 .rank span{background:linear-gradient(135deg,#ffe38a,#a87514);color:#261900}.top2 .rank span{background:linear-gradient(135deg,#eef3f7,#718292);color:#101820}.top3 .rank span{background:linear-gradient(135deg,#e6a269,#824214)}.owner{font-weight:850}.teams{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:8px;background:#192f49;border-radius:10px;padding:7px 10px;color:#e4f0fc;font-weight:750}.team-logo{width:30px;height:30px;object-fit:contain}.placeholder{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;background:#344861;color:#9db0c5;font-size:9px}.score{color:#77e1ff;font-size:1.2rem;font-weight:950}.extras{opacity:.72}.api-status{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:10px 20px;border-top:1px solid #ffffff13;color:var(--muted);font-size:.8rem}.api-status.ok{color:var(--ok)}.api-status.error{color:var(--warn)}.status-main{display:flex;align-items:center;gap:9px}.last-updated{white-space:nowrap;color:#91a8bf}.spinner{display:none;width:17px;height:17px;flex:0 0 17px;border:2px solid #ffffff35;border-top-color:#54b8ff;border-radius:50%;animation:spin .75s linear infinite}.api-status.loading .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}.error-details{display:none;padding:12px 20px;border-top:1px solid #ffffff13;background:#091521;color:#ffbd91;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.error-details.visible{display:block}.footer{text-align:center;color:#758aa1;font-size:.78rem;margin-top:20px}@media(max-width:650px){.shell{padding-top:12px}.logo-wrap{flex-basis:112px;width:112px;height:112px;padding:7px}.card{border-radius:17px}.api-status{align-items:flex-start;flex-direction:column}.last-updated{align-self:flex-end}}

@media(max-width:650px){
  body{background:radial-gradient(circle at 50% 0,#17385f,transparent 25%),#07111f}
  .shell{width:min(100% - 16px,1180px);padding:8px 0 32px}
  header{padding:14px;border-radius:18px;gap:13px;align-items:center}
  .logo-wrap{flex:0 0 76px;width:76px;height:76px;padding:5px;border-radius:15px}
  .fallback{width:54px;height:61px;border-width:3px;font-size:17px}
  h1{font-size:1.35rem;line-height:1.12}
  header p{font-size:.78rem;line-height:1.35;margin:5px 0}
  .current-chip{margin-top:7px;padding:5px 8px;font-size:.65rem}
  .season-nav{margin:10px 0;padding:7px;gap:7px;border-radius:14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .season-nav::-webkit-scrollbar{display:none}
  .season-btn{min-width:96px;padding:10px 11px;border-radius:10px;font-size:.78rem;scroll-snap-align:start}
  .season-btn.current-season::after{display:block;width:max-content;margin:4px auto 0;font-size:.48rem}
  .card{border-radius:16px;background:transparent;border:0;box-shadow:none;overflow:visible}
  .head{margin-bottom:8px;padding:12px 13px;border:1px solid #ffffff18;border-radius:14px;background:rgba(13,29,49,.96)}
  h2{font-size:.86rem}.sub{font-size:.72rem}.badge{font-size:.68rem}
  .wrap{overflow:visible}
  table,tbody{display:block;width:100%;min-width:0}
  thead{display:none}
  tbody{display:grid;gap:9px}
  tr{display:grid;grid-template-columns:42px minmax(0,1fr) auto;grid-template-areas:"rank owner score" "teams teams teams";align-items:center;gap:10px;padding:12px;background:rgba(13,29,49,.96);border:1px solid #ffffff18;border-radius:15px;box-shadow:0 9px 28px #0004}
  td{padding:0;border:0;min-width:0}
  td.rank{grid-area:rank}.owner{grid-area:owner;font-size:1rem}.team-cell{grid-area:teams}.score{grid-area:score;text-align:right;font-size:1.25rem}
  .score::before{content:"TOTAL";display:block;margin-bottom:2px;color:var(--muted);font-size:.52rem;letter-spacing:.1em;font-weight:800}
  .rank span{width:38px;height:38px;border-radius:11px}
  .teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .pill{justify-content:center;gap:5px;padding:7px 5px;border-radius:9px;font-size:.68rem;white-space:nowrap}
  .team-logo,.placeholder{width:25px;height:25px;flex:0 0 25px}.placeholder{font-size:7px}
  .api-status{margin-top:9px;padding:11px 13px;align-items:flex-start;flex-direction:column;border:1px solid #ffffff18;border-radius:13px;background:rgba(13,29,49,.96);line-height:1.4}
  .last-updated{align-self:flex-start;white-space:normal}
  .error-details{margin-top:7px;border:1px solid #ffffff13;border-radius:12px}
  .footer{margin-top:14px}
}
@media(max-width:370px){
  .teams{grid-template-columns:1fr}
  .pill{justify-content:flex-start;padding-left:10px}
  header p{display:none}
}

</style></head>
<body><main class="shell">
<header><div class="logo-wrap"><img class="nhl-logo" src="https://assets.nhle.com/logos/nhl/svg/NHL_light.svg" alt="NHL logo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback">NHL</div></div><div><h1>Fantasy NHL League</h1><p>Three NHL teams per owner. Rankings use combined team points.</p><div class="current-chip"><span class="current-dot"></span><span id="currentSeasonChip"></span></div></div></header>
<nav class="season-nav" id="seasonNav" aria-label="Season selection"></nav>
<section class="card"><div class="head"><div><h2>League Standings</h2><div class="sub" id="seasonLabel"></div></div><span class="badge" id="ownerCount"></span></div><div class="wrap"><table><thead><tr><th>Rank</th><th>Owner</th><th>NHL Teams</th><th>Total Points</th></tr></thead><tbody id="standings"></tbody></table></div><div class="api-status" id="apiStatus"><span class="status-main"><span class="spinner" aria-hidden="true"></span><span id="statusText"></span></span><span class="last-updated" id="lastUpdated"></span></div><div class="error-details" id="errorDetails"></div></section>
<div class="footer">Unofficial fan-made fantasy pool.</div></main>
<script>
/* ==========================================================================
   SEASON SETUP - EDIT THIS SECTION WHEN TEAMS ARE SELECTED

   1. Change CURRENT_SEASON to the season you want opened by default.
   2. Add a new season inside leagueData using the same format.
   3. Each regular owner should have exactly 3 NHL abbreviations.
   4. Use "XXX" for a team that has not been selected yet.
   5. Keep extras: true on the Extras row so it stays at the bottom.

   Example new owner:
   { name: "Name", teams: ["TOR", "DET", "COL"] },
   ========================================================================== */

const CURRENT_SEASON = "2026-27";

const leagueData = {
  "2022-23": [
    { name: "Ian",   teams: ["TOR", "FLA", "ARI"] },
    { name: "Will",  teams: ["CAR", "VAN", "DET"] },
    { name: "Dave",  teams: ["COL", "NYI", "BUF"] },
    { name: "Dan",   teams: ["TBL", "PIT", "CBJ"] },
    { name: "Monti", teams: ["EDM", "NSH", "ANA"] },
    { name: "Soap",  teams: ["WPG", "OTT", "STL"] },
    { name: "Corey", teams: ["MTL", "NYR", "DAL"] },
    { name: "Schum", teams: ["CAL", "LAK", "SEA"] },

    { name: "Henry", teams: ["VGK", "MIN", "PHI"] },
    { name: "Extras", teams: ["CHI", "SJS"], extras: true }
  ],

  "2023-24": [
    { name: "Ian",   teams: ["CAR", "LAK", "STL"] },
    { name: "Will",  teams: ["NYR", "DAL", "VAN"] },
    { name: "Dave",  teams: ["BOS", "NJD", "CHI"] },
    { name: "Dan",   teams: ["NYI", "DET", "MIN"] },
    { name: "Monti", teams: ["WSH", "SEA", "BUF"] },
    { name: "Soap",  teams: ["WPG", "FLA", "ANA"] },
    { name: "Corey", teams: ["EDM", "OTT", "CBJ"] },
    { name: "Schum", teams: ["ARI", "CGY", "COL"] },
    { name: "Paul",  teams: ["TBL", "PIT", "MTL"] },
    { name: "Henry", teams: ["TOR", "NSH", "VGK"] },
    { name: "Extras", teams: ["SJS", "PHI"], extras: true }
  ],

  "2024-25": [
    { name: "Ian",   teams: ["TOR", "NSH", "CHI"] },
    { name: "Will",  teams: ["WPG", "VAN", "NYI"] },
    { name: "Dave",  teams: ["DAL", "CAR", "MTL"] },
    { name: "Dan",   teams: ["COL", "MIN", "UTA"] },
    { name: "Monti", teams: ["OTT", "BUF", "BOS"] },
    { name: "Soap",  teams: ["EDM", "CGY", "DET"] },
    { name: "Corey", teams: ["FLA", "PIT", "ANA"] },
    { name: "Schum", teams: ["CBJ", "SEA", "SJS"] },
    { name: "Paul",  teams: ["VGK", "STL", "NJD"] },
    { name: "Henry", teams: ["LAK", "TBL", "NYR"] },
    { name: "Extras", teams: ["PHI", "WSH"], extras: true }
  ],

  "2025-26": [
    { name: "Ian",   teams: ["COL", "OTT", "DET"] },
    { name: "Will",  teams: ["DAL", "STL", "BOS"] },
    { name: "Dave",  teams: ["VGK", "MTL", "PHI"] },
    { name: "Dan",   teams: ["CAR", "NYR", "CBJ"] },
    { name: "Monti", teams: ["WSH", "BUF", "NYI"] },
    { name: "Soap",  teams: ["TBL", "MIN", "SEA"] },
    { name: "Corey", teams: ["EDM", "VAN", "ANA"] },
    { name: "Schum", teams: ["FLA", "UTA", "CHI"] },
    { name: "Paul",  teams: ["TOR", "LAK", "CGY"] },
    { name: "Henry", teams: ["WPG", "NJD", "NSH"] },
    { name: "Extras", teams: ["PIT", "SJS"], extras: true }
  ],

  /* Copy this season block when setting up the next season. */
  "2026-27": [
    { name: "Ian",   teams: ["NYR", "LAK", "MIN"] },
    { name: "Will",  teams: ["TBL", "MTL", "XXX"] },
    { name: "Dave",  teams: ["CAR", "SJS", "CBJ"] },
    { name: "Dan",   teams: ["DAL", "UTA", "NSH"] },
    { name: "Monti", teams: ["BUF", "OTT", "TOR"] },
    { name: "Soap",  teams: ["COL", "BOS", "NYI"] },
    { name: "Corey", teams: ["WAS", "ANA", "XXX"] },
    { name: "Schum", teams: ["DET", "VGK", "PHI"] },
    { name: "Paul",  teams: ["FLA", "STL", "PIT"] },
    { name: "Henry", teams: ["EDM", "NJD", "XXX"] },
    { name: "Extras", teams: ["XXX", "XXX"], extras: true }
  ]
};

/* Past-season final points. Add an empty object for every new current season. */
const pointsBySeason={
"2022-23":{ANA:58,ARI:70,BOS:135,BUF:91,CAL:93,CAR:113,CHI:59,COL:109,CBJ:59,DAL:108,DET:80,EDM:109,FLA:92,LAK:104,MIN:103,MTL:68,NJD:112,NSH:92,NYI:93,NYR:107,OTT:86,PHI:75,PIT:91,SJS:60,SEA:100,STL:81,TBL:98,TOR:111,VAN:83,VGK:111,WAS:80,WPG:95},
"2023-24":{ANA:59,ARI:77,BOS:109,BUF:84,CGY:81,CAR:111,CHI:52,COL:107,CBJ:66,DAL:113,DET:91,EDM:104,FLA:110,LAK:99,MIN:87,MTL:76,NJD:81,NSH:99,NYI:94,NYR:114,OTT:78,PHI:87,PIT:88,SJS:47,SEA:81,STL:92,TBL:98,TOR:102,VAN:109,VGK:98,WSH:91,WPG:110},
"2024-25":{ANA:80,BOS:76,BUF:79,CGY:96,CAR:99,CHI:61,COL:102,CBJ:89,DAL:106,DET:86,EDM:101,FLA:98,LAK:105,MIN:97,MTL:91,NJD:91,NSH:68,NYI:82,NYR:85,OTT:97,PHI:76,PIT:80,SJS:52,SEA:76,STL:96,TBL:102,TOR:108,UTA:89,VAN:90,VGK:110,WSH:111,WPG:116},
"2025-26":{ANA:92,BOS:100,BUF:109,CGY:77,CAR:113,CHI:72,COL:121,CBJ:92,DAL:112,DET:92,EDM:93,FLA:84,LAK:90,MIN:104,MTL:106,NJD:87,NSH:86,NYI:91,NYR:77,OTT:99,PHI:98,PIT:98,SJS:86,SEA:79,STL:86,TBL:106,TOR:78,UTA:92,VAN:58,VGK:95,WSH:95,WPG:82},"2026-27":{}};
const CURRENT=CURRENT_SEASON,seasons=Object.keys(leagueData),aliases={CAL:"CGY",WAS:"WSH"};let season=CURRENT,lastSuccessfulUpdate=null,currentLogos={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const apiCode=code=>aliases[code]||code,teamPoints=code=>Number(pointsBySeason[season]?.[apiCode(code)])||0,total=o=>o.teams.reduce((n,c)=>n+teamPoints(c),0);
const logoUrl=code=>code==="XXX"?"":currentLogos[apiCode(code)]||`https://assets.nhle.com/logos/nhl/svg/${apiCode(code)}_light.svg`;
const formatUpdated=d=>new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit"}).format(d);
function renderButtons(){seasonNav.innerHTML=seasons.map(s=>`<button class="season-btn ${s===season?'active':''} ${s===CURRENT?'current-season':''}" data-season="${s}" aria-pressed="${s===season}">${s}</button>`).join("")}
function render(){const owners=[...leagueData[season]].sort((a,b)=>a.extras-b.extras||total(b)-total(a)||a.name.localeCompare(b.name));let rank=0;seasonLabel.textContent=`${season} season results`;ownerCount.textContent=`${owners.filter(o=>!o.extras).length} owners`;standings.innerHTML=owners.map(o=>{if(!o.extras)rank++;return `<tr class="top${rank} ${o.extras?'extras':''}"><td class="rank"><span>${o.extras?'E':rank}</span></td><td class="owner">${esc(o.name)}</td><td class="team-cell"><div class="teams">${o.teams.map(code=>`<span class="pill">${logoUrl(code)?`<img class="team-logo" src="${logoUrl(code)}" alt="${esc(code)} logo" onerror="this.style.display='none'">`:`<span class="placeholder">TBD</span>`}<span>${esc(code)} · ${teamPoints(code)} pts</span></span>`).join("")}</div></td><td class="score">${total(o)}</td></tr>`}).join("");if(season!==CURRENT){apiStatus.className="api-status ok";statusText.textContent="Final regular-season points are stored directly in this file.";lastUpdated.textContent="Final season data";errorDetails.className="error-details";errorDetails.textContent=""}}
async function loadStandingsJson(){if(season!==CURRENT)return;apiStatus.className="api-status loading";errorDetails.className="error-details";errorDetails.textContent="";statusText.textContent="Loading current standings from standings.json...";lastUpdated.textContent=lastSuccessfulUpdate?`Last updated ${formatUpdated(lastSuccessfulUpdate)}`:"";const url=`./standings.json?cache=${Date.now()}`;try{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status} ${response.statusText}`);const payload=await response.json();if(!Array.isArray(payload.teams)||payload.teams.length<30)throw new Error("standings.json does not contain at least 30 teams");const points={},logos={};for(const team of payload.teams){if(!team.abbrev)continue;points[team.abbrev]=Number(team.points)||0;if(team.logo)logos[team.abbrev]=team.logo}if(Object.keys(points).length<30)throw new Error("standings.json contains fewer than 30 valid team abbreviations");pointsBySeason[CURRENT]=points;currentLogos=logos;lastSuccessfulUpdate=payload.updatedAt?new Date(payload.updatedAt):new Date();render();apiStatus.className="api-status ok";statusText.textContent="Current standings loaded from standings.json.";lastUpdated.textContent=`Last updated ${formatUpdated(lastSuccessfulUpdate)}`}catch(error){apiStatus.className="api-status error";statusText.textContent="Could not load standings.json. Details are shown below.";lastUpdated.textContent=lastSuccessfulUpdate?`Last updated ${formatUpdated(lastSuccessfulUpdate)}`:"No successful update yet";errorDetails.textContent=[`Time: ${new Date().toLocaleString()}`,`File: ${new URL(url,location.href).href}`,`Error: ${error.name||"Error"}: ${error.message||String(error)}`,`Online: ${navigator.onLine?"Yes":"No"}`,`Page protocol: ${location.protocol}`,"Expected: standings.json in the same folder as index.html"].join("\n");errorDetails.className="error-details visible"}finally{}}
if(!leagueData[CURRENT]){console.warn(`CURRENT_SEASON ${CURRENT} is not present in leagueData. Falling back to the newest season.`);season=seasons[seasons.length-1]}
currentSeasonChip.textContent=`${CURRENT} Current Season`;
seasonNav.addEventListener("click",e=>{const b=e.target.closest("[data-season]");if(!b)return;season=b.dataset.season;renderButtons();render();if(season===CURRENT)loadStandingsJson()});renderButtons();render();loadStandingsJson();setInterval(()=>{if(season===CURRENT)loadStandingsJson()},15*60*1000);
</script></body></html>
